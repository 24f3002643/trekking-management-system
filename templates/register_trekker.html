{% extends "base_auth.html" %}

{% block title %}Trekker Registration{% endblock %}

{% block form_body %}
<h2 class="text-center mb-3">Trekker Registration</h2>
<form action="{{ url_for('auth.register_trekker') }}" method="post">
    <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" class="form-control" name="name" maxlength="50" placeholder="Enter your full name" required>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" name="email" maxlength="255" placeholder="Enter your email" required>
    </div>
    <div class="mb-3">
        <label for="phone_number" class="form-label">Phone Number</label>
        <input type="tel" id="phone_number" class="form-control" name="phone_number" maxlength="20" placeholder="Enter your phone number">
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" name="password" maxlength="255" placeholder="Enter your password" required>
    </div>
    <div class="text-center">
        <input type="submit" value="Register as a Trekker" class="btn btn-primary w-100">
    </div>
    <div class="text-center mt-3">
        <p class="mb-2">Already Registered?</p>
        <a href="{{ url_for('auth.login') }}" class="d-block">Login</a>
    </div>
</form>
{% endblock %}
