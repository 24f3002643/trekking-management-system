{% extends "base_auth.html" %}

{% block title %}Login{% endblock %}

{% block form_body %}
<h2 class="text-center mb-3">Login Page</h2>
<form action="{{ url_for('auth.login') }}" method="post">
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" name="email" maxlength="255" required>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" name="password" maxlength="255" required>
    </div>
    <div class="text-center">
        <input type="submit" value="Login" class="btn btn-primary w-100">
    </div>
    <div class="text-center mt-3">
        <p class="mb-2">New Here?</p>
        <a href="{{ url_for('auth.register_trekker') }}" class="d-block">Register as a Trekker</a>
        <a href="{{ url_for('auth.register_staff') }}" class="d-block mt-1">Register as a Staff</a>
    </div>
</form>
{% endblock %}
