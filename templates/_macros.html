{% macro stat_card(title, value, icon) %}
<div class="col-md-3">
    <div class="card stat-card">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h6 class="card-subtitle mb-1 ">{{ title }}</h6>
                <h2 class="mb-0">{{ value }}</h2>
            </div>
            <i class="bi bi-{{ icon }} stat-icon"></i>
        </div>
    </div>
</div>
{% endmacro %}

{% macro detail_item(label, value) %}
<div class="mb-2">
    <strong>{{ label }} : </strong> {{ value }} 
</div>
{% endmacro %}
